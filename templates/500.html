{% extends "base.html" %}

{% block title %}500 - Internal Service Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="fiori-card p-5">
            <i class="bi bi-exclamation-triangle-fill text-warning display-1 mb-3"></i>
            <h3 class="fw-bold text-dark mb-2">500 — System Exception</h3>
            <p class="text-secondary mb-4">
                An internal processing or database error occurred while querying the SAP Warranty Exception repository.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-3">
                    <i class="bi bi-house-door me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
